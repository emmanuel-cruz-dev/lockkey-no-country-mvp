<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LockKey es un gestor de contraseñas seguro y fácil de usar, diseñado para proteger tus datos personales y simplificar tu vida digital. Desarrollado con Vite, React, Tailwind CSS y TypeScript."
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap"
      as="style"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="icon" type="image/png" href="/logo-icon.png" />

    <!-- Precarga de imagenes de Hero -->
    <link rel="preload" href="./src/assets/hero-banner.avif" as="image" />
    <link
      rel="preload"
      href="./src/assets/gradient-background-img.avif"
      as="image"
    />
    <title>LockKey | Gestor de Contraseñas</title>

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="LockKey | Gestor de Contraseñas" />
    <meta
      property="og:description"
      content="LockKey te permite generar, almacenar y gestionar contraseñas de forma segura."
    />
    <meta property="og:image" content="/lock-key.webp" />
    <meta property="og:url" content="https://lock-key.vercel.app" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/Frontend/main.tsx"></script>
  </body>
</html>
